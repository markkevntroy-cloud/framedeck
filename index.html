<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Storyboard Creator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://tailwindcss.com"></script>
    <!-- html2pdf.js library for high-quality PDF exports -->
    <script src="https://cloudflare.com"></script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-8 font-sans">

    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg p-6">
        <!-- Control Header (Hidden in exported PDF) -->
        <div class="no-print flex flex-wrap justify-between items-center border-b pb-4 mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Storyboard Board Generator</h1>
                <p class="text-sm text-gray-500">Fill in details, upload images/GIFs, and export to PDF.</p>
            </div>
            <div class="flex gap-2">
                <button id="add-shot-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded transition">
                    + Add Shot
                </button>
                <button id="export-pdf-btn" class="bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded transition">
                    Download PDF
                </button>
            </div>
        </div>

        <!-- Document Header (Visible in PDF) -->
        <div class="mb-6">
            <input type="text" value="Project Title: My Awesome Video" class="text-2xl font-bold text-gray-800 border-b border-transparent hover:border-gray-300 focus:border-blue-500 focus:outline-none w-full py-1">
            <input type="text" value="Director: Jane Doe | Date: 2026-09-01" class="text-sm text-gray-500 border-b border-transparent hover:border-gray-300 focus:border-blue-500 focus:outline-none w-full py-1 mt-1">
        </div>

        <!-- Storyboard Container -->
        <div id="storyboard-container" class="space-y-6">
            <!-- Dynamic rows are inserted here by app.js -->
        </div>
    </div>

    <!-- Application Logic -->
    <script src="app.js"></script>
</body>
</html>
