<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FrameDeck — Visual Creative Board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">Frame<span>Deck</span></div>
    <input id="projectName" class="project-name" value="Untitled Creative Project">
    <div class="top-actions">
      <button id="undoBtn" class="icon-btn" title="Undo">↶</button>
      <button id="redoBtn" class="icon-btn" title="Redo">↷</button>
      <button id="zoomOut" class="icon-btn">−</button>
      <span id="zoomValue">100%</span>
      <button id="zoomIn" class="icon-btn">+</button>
      <button id="fitBtn" class="btn">Fit</button>
      <button id="saveBtn" class="btn">Save</button>
      <button id="exportBtn" class="btn">Export</button>
      <button id="presentBtn" class="btn primary">Present</button>
    </div>
  </header>

  <aside class="leftbar">
    <div class="left-section-title">Create</div>
    <button class="add-tool" data-type="text"><b>T</b><span>Text</span></button>
    <button class="add-tool" data-type="image"><b>▧</b><span>Image</span></button>
    <button class="add-tool" data-type="video"><b>▶</b><span>Video</span></button>
    <button class="add-tool" data-type="shot"><b>🎬</b><span>Shot</span></button>
    <button class="add-tool" data-type="note"><b>●</b><span>Note</span></button>
    <button class="add-tool" data-type="link"><b>↗</b><span>Link</span></button>
    <button class="add-tool" data-type="checklist"><b>✓</b><span>Tasks</span></button>
    <button class="add-tool" data-type="color"><b>◼</b><span>Color</span></button>
    <button class="add-tool" data-type="section"><b>▤</b><span>Section</span></button>
    <div class="left-divider"></div>
    <button id="uploadBtn" class="upload-btn">Upload files</button>
    <input id="fileInput" type="file" multiple accept="image/*,video/*,.pdf,.txt" hidden>
    <div class="left-bottom">
      <button id="deleteBtn" class="small-btn">Delete selected</button>
      <button id="clearBtn" class="small-btn">Clear board</button>
    </div>
  </aside>

  <main id="viewport" class="viewport">
    <div id="board" class="board">
      <div id="grid" class="grid"></div>
      <div id="items"></div>
    </div>
    <div id="emptyHint" class="empty-hint">
      <strong>Start your creative board</strong>
      <span>Drag cards around • Scroll to zoom • Hold Space and drag to pan</span>
    </div>
  </main>

  <aside class="rightbar">
    <div class="inspector-title">Inspector</div>
    <div id="noSelection" class="no-selection">Select an item to edit it.</div>
    <div id="inspector" hidden>
      <label>Type</label>
      <div id="selectedType" class="type-pill"></div>

      <label>Title</label>
      <input id="fieldTitle" type="text">

      <label>Content</label>
      <textarea id="fieldContent"></textarea>

      <div class="two">
        <div><label>X</label><input id="fieldX" type="number"></div>
        <div><label>Y</label><input id="fieldY" type="number"></div>
      </div>
      <div class="two">
        <div><label>Width</label><input id="fieldW" type="number"></div>
        <div><label>Height</label><input id="fieldH" type="number"></div>
      </div>

      <label>Color</label>
      <div id="colorChoices" class="color-choices"></div>

      <div id="shotFields" hidden>
        <label>Shot size</label>
        <select id="shotSize">
          <option>Wide</option><option>Medium</option><option>Close Up</option><option>Extreme Close Up</option><option>Over The Shoulder</option><option>POV</option>
        </select>
        <label>Camera movement</label>
        <input id="cameraMove" type="text" placeholder="Push in, pan, handheld...">
        <label>Lens</label>
        <input id="lens" type="text" placeholder="24mm">
        <label>Audio</label>
        <input id="audio" type="text" placeholder="Dialogue / ambience / music">
        <label>Director notes</label>
        <textarea id="directorNotes"></textarea>
      </div>

      <div id="linkFields" hidden>
        <label>URL</label>
        <input id="urlField" type="url" placeholder="https://...">
      </div>

      <button id="duplicateBtn" class="btn full">Duplicate</button>
      <button id="bringFrontBtn" class="btn full">Bring to front</button>
      <button id="deleteSelected" class="danger-btn full">Delete</button>
    </div>
  </aside>

  <div id="toast" class="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
